<!doctype html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>BladeIA Instagram Renderer</title>
		<style>
			:root {
				--black: #020306;
				--panel: rgba(8, 12, 20, 0.78);
				--panel-strong: rgba(12, 18, 30, 0.92);
				--line: rgba(130, 207, 255, 0.34);
				--cyan: #38bdf8;
				--cyan-strong: #12d7ff;
				--violet: #a78bfa;
				--green: #22c55e;
				--text: #f8fafc;
				--muted: #cbd5e1;
				--silver-1: #ffffff;
				--silver-2: #9aa4b2;
			}

			* {
				box-sizing: border-box;
			}

			html,
			body {
				width: 1080px;
				height: 1350px;
				margin: 0;
				overflow: hidden;
				background: var(--black);
				font-family:
					Inter,
					Sora,
					Arial,
					Helvetica,
					sans-serif;
			}

			body {
				display: grid;
				place-items: center;
			}

			.post {
				position: relative;
				width: 1080px;
				height: 1350px;
				overflow: hidden;
				color: var(--text);
				background:
					radial-gradient(circle at 82% 19%, rgba(67, 83, 107, 0.34), transparent 0 210px, transparent 360px),
					radial-gradient(circle at 19% 76%, rgba(56, 189, 248, 0.18), transparent 0 220px, transparent 410px),
					linear-gradient(180deg, #030407 0%, #04070d 52%, #020306 100%);
			}

			.post::before {
				content: "";
				position: absolute;
				inset: 0;
				background-image:
					linear-gradient(rgba(83, 120, 165, 0.16) 1px, transparent 1px),
					linear-gradient(90deg, rgba(83, 120, 165, 0.16) 1px, transparent 1px),
					radial-gradient(circle, rgba(167, 139, 250, 0.5) 0 1.5px, transparent 2.5px);
				background-size:
					132px 132px,
					132px 132px,
					124px 124px;
				background-position:
					-10px -20px,
					-10px -20px,
					38px 24px;
				opacity: 0.46;
			}

			.post::after {
				content: "";
				position: absolute;
				inset: 0;
				background:
					linear-gradient(115deg, transparent 0 58%, rgba(56, 189, 248, 0.12) 59%, transparent 61%),
					linear-gradient(0deg, rgba(1, 3, 8, 0.18), rgba(1, 3, 8, 0.58));
				pointer-events: none;
			}

			.brand {
				position: absolute;
				z-index: 5;
				top: 58px;
				left: 70px;
				display: flex;
				align-items: center;
				gap: 18px;
			}

			.brand-mark {
				width: 64px;
				height: 64px;
				border: 1px solid rgba(56, 189, 248, 0.72);
				border-radius: 14px;
				box-shadow:
					0 0 22px rgba(56, 189, 248, 0.35),
					inset 0 0 16px rgba(56, 189, 248, 0.16);
				background: #05070c;
				object-fit: cover;
			}

			.brand-name {
				font-size: 34px;
				font-weight: 800;
				line-height: 1;
				color: #ffffff;
			}

			.content {
				position: relative;
				z-index: 3;
				width: 100%;
				height: 100%;
				padding: 150px 70px 72px;
			}

			.kicker {
				margin: 10px 0 24px;
				font-size: 17px;
				font-weight: 800;
				line-height: 1;
				color: var(--cyan);
				text-transform: uppercase;
			}

			.title {
				max-width: 940px;
				margin: 0;
				font-size: 72px;
				font-weight: 950;
				line-height: 1.04;
				text-wrap: balance;
				color: transparent;
				background: linear-gradient(180deg, var(--silver-1) 0%, #eef3fb 42%, var(--silver-2) 100%);
				-webkit-background-clip: text;
				background-clip: text;
				text-shadow:
					0 1px 0 rgba(255, 255, 255, 0.22),
					0 22px 60px rgba(56, 189, 248, 0.2);
			}

			.title .accent {
				color: transparent;
				background: linear-gradient(180deg, #d8c8ff 0%, #a78bfa 52%, #7dd3fc 100%);
				-webkit-background-clip: text;
				background-clip: text;
			}

			.subtitle {
				max-width: 850px;
				margin: 28px 0 0;
				font-size: 28px;
				font-weight: 500;
				line-height: 1.34;
				color: var(--muted);
			}

			.visual {
				position: absolute;
				z-index: 3;
				left: 70px;
				right: 70px;
				bottom: 108px;
			}

			.screenshot-card {
				position: relative;
				overflow: hidden;
				border: 1px solid rgba(56, 189, 248, 0.76);
				border-radius: 30px;
				background: rgba(2, 6, 12, 0.78);
				box-shadow:
					0 34px 90px rgba(0, 0, 0, 0.55),
					0 0 34px rgba(56, 189, 248, 0.24),
					inset 0 1px 0 rgba(255, 255, 255, 0.1);
			}

			.screenshot-card img {
				display: block;
				width: 100%;
				height: 100%;
				object-fit: cover;
			}

			.screenshot-card.large {
				height: 560px;
				padding: 26px;
			}

			.screenshot-card.large img {
				border-radius: 18px;
			}

			.screenshot-card.tilt {
				height: 552px;
				transform: perspective(1100px) rotateX(4deg) rotateY(-5deg) rotateZ(-1.2deg);
			}

			.chips {
				display: grid;
				grid-template-columns: repeat(3, 1fr);
				gap: 38px;
				margin-top: 34px;
			}

			.chip {
				display: flex;
				align-items: center;
				justify-content: center;
				min-height: 58px;
				padding: 0 26px;
				border: 2px solid var(--line);
				border-radius: 16px;
				background: rgba(6, 11, 20, 0.7);
				color: #ffffff;
				font-size: 22px;
				font-weight: 800;
				box-shadow: 0 0 22px rgba(56, 189, 248, 0.18);
			}

			.chip.cyan {
				border-color: var(--cyan);
				background: rgba(8, 47, 73, 0.58);
			}

			.chip.violet {
				border-color: var(--violet);
				background: rgba(49, 36, 82, 0.58);
			}

			.chip.green {
				border-color: var(--green);
				background: rgba(8, 72, 41, 0.54);
			}

			.footer {
				position: absolute;
				z-index: 4;
				left: 76px;
				bottom: 64px;
				font-size: 24px;
				font-weight: 800;
				color: rgba(226, 232, 240, 0.78);
			}

			.orbit {
				position: absolute;
				z-index: 2;
				width: 470px;
				height: 470px;
				border: 1px solid rgba(125, 211, 252, 0.16);
				border-radius: 50%;
				box-shadow:
					0 0 120px rgba(56, 189, 248, 0.15),
					inset 0 0 80px rgba(167, 139, 250, 0.1);
			}

			.logo-focus .brand {
				display: none;
			}

			.logo-focus .content {
				padding-top: 170px;
				text-align: center;
			}

			.logo-focus .title {
				margin: 0 auto;
				font-size: 78px;
				text-transform: uppercase;
			}

			.logo-lockup {
				position: absolute;
				z-index: 4;
				left: 50%;
				top: 618px;
				display: grid;
				place-items: center;
				width: 430px;
				height: 260px;
				transform: translateX(-50%);
			}

			.logo-lockup::before {
				content: "";
				position: absolute;
				width: 410px;
				height: 410px;
				border: 1px solid rgba(125, 211, 252, 0.2);
				border-radius: 50%;
				background: radial-gradient(circle, rgba(56, 189, 248, 0.28), transparent 0 25%, transparent 65%);
				box-shadow: 0 0 120px rgba(56, 189, 248, 0.34);
			}

			.logo-lockup img {
				position: relative;
				width: 150px;
				height: 150px;
				object-fit: contain;
				filter: drop-shadow(0 0 22px rgba(56, 189, 248, 0.7));
			}

			.logo-word {
				position: relative;
				margin-top: -18px;
				font-size: 70px;
				font-weight: 850;
				color: transparent;
				background: linear-gradient(180deg, #ffffff 0%, #aeb7c4 54%, #38bdf8 100%);
				-webkit-background-clip: text;
				background-clip: text;
			}

			.connected-chip {
				position: absolute;
				z-index: 5;
				display: flex;
				align-items: center;
				gap: 16px;
				height: 82px;
				padding: 0 28px;
				border: 1px solid rgba(167, 139, 250, 0.82);
				border-radius: 16px;
				background: rgba(9, 12, 22, 0.84);
				box-shadow:
					0 0 30px rgba(167, 139, 250, 0.24),
					inset 0 1px 0 rgba(255, 255, 255, 0.08);
				font-size: 28px;
				font-weight: 800;
			}

			.connected-chip svg {
				width: 34px;
				height: 34px;
				color: var(--violet);
			}

			.connected-chip.left {
				left: 90px;
				top: 670px;
			}

			.connected-chip.right {
				right: 92px;
				top: 670px;
			}

			.connected-chip.bottom {
				left: 50%;
				top: 1110px;
				transform: translateX(-50%);
			}

			.connector {
				position: absolute;
				z-index: 3;
				height: 1px;
				background: linear-gradient(90deg, transparent, rgba(167, 139, 250, 0.88), transparent);
				box-shadow: 0 0 10px rgba(167, 139, 250, 0.8);
				transform-origin: left center;
			}

			.split-visual {
				display: grid;
				grid-template-columns: 1fr 1fr;
				gap: 28px;
				height: 520px;
			}

			.split-panel,
			.matrix-panel,
			.process-panel,
			.metrics-panel {
				border: 1px solid rgba(125, 211, 252, 0.34);
				border-radius: 24px;
				background: var(--panel);
				box-shadow:
					0 28px 74px rgba(0, 0, 0, 0.42),
					inset 0 1px 0 rgba(255, 255, 255, 0.08);
				backdrop-filter: blur(12px);
			}

			.split-panel {
				position: relative;
				overflow: hidden;
				padding: 28px;
			}

			.split-panel h2,
			.matrix-panel h2 {
				margin: 0 0 22px;
				font-size: 34px;
				line-height: 1;
			}

			.bubble {
				width: fit-content;
				max-width: 330px;
				margin: 18px 0;
				padding: 18px 20px;
				border-radius: 18px;
				background: rgba(15, 23, 42, 0.92);
				border: 1px solid rgba(56, 189, 248, 0.26);
				font-size: 22px;
				line-height: 1.28;
				color: #e2e8f0;
			}

			.bubble.reply {
				margin-left: auto;
				background: rgba(8, 72, 41, 0.72);
				border-color: rgba(34, 197, 94, 0.5);
			}

			.mini-shot {
				position: absolute;
				left: 26px;
				right: 26px;
				bottom: 26px;
				height: 250px;
				overflow: hidden;
				border: 1px solid rgba(148, 163, 184, 0.22);
				border-radius: 18px;
			}

			.mini-shot img {
				width: 100%;
				height: 100%;
				object-fit: cover;
			}

			.matrix-panel {
				display: grid;
				grid-template-columns: 1fr 1fr;
				gap: 22px;
				padding: 28px;
			}

			.matrix-list {
				display: flex;
				flex-direction: column;
				gap: 16px;
			}

			.matrix-pill {
				padding: 16px 18px;
				border: 1px solid rgba(148, 163, 184, 0.26);
				border-radius: 15px;
				background: rgba(15, 23, 42, 0.78);
				font-size: 22px;
				font-weight: 700;
				line-height: 1.14;
			}

			.process-panel {
				position: relative;
				height: 520px;
				padding: 38px;
			}

			.steps {
				position: relative;
				display: grid;
				grid-template-columns: repeat(5, 1fr);
				gap: 14px;
				margin-top: 14px;
			}

			.step {
				position: relative;
				min-height: 126px;
				padding: 20px 14px;
				border: 1px solid rgba(56, 189, 248, 0.36);
				border-radius: 18px;
				background: rgba(8, 13, 24, 0.84);
				text-align: center;
			}

			.step-number {
				display: grid;
				place-items: center;
				width: 38px;
				height: 38px;
				margin: 0 auto 14px;
				border-radius: 50%;
				background: rgba(56, 189, 248, 0.16);
				color: #7dd3fc;
				font-size: 18px;
				font-weight: 900;
			}

			.step-label {
				font-size: 18px;
				font-weight: 850;
				line-height: 1.16;
			}

			.process-shot {
				position: absolute;
				left: 58px;
				right: 58px;
				bottom: 36px;
				height: 250px;
				overflow: hidden;
				border: 1px solid rgba(125, 211, 252, 0.32);
				border-radius: 18px;
				opacity: 0.95;
			}

			.process-shot img {
				width: 100%;
				height: 100%;
				object-fit: cover;
			}

			.metrics-panel {
				height: 520px;
				padding: 34px;
			}

			.metric-grid {
				display: grid;
				grid-template-columns: repeat(2, 1fr);
				gap: 20px;
			}

			.metric-tile {
				min-height: 140px;
				padding: 22px;
				border: 1px solid rgba(125, 211, 252, 0.28);
				border-radius: 20px;
				background: var(--panel-strong);
			}

			.metric-label {
				font-size: 20px;
				font-weight: 800;
				color: #cbd5e1;
			}

			.metric-value {
				margin-top: 14px;
				font-size: 46px;
				font-weight: 950;
				color: #ffffff;
			}

			.metric-note {
				margin-top: 8px;
				font-size: 17px;
				font-weight: 700;
				color: #7dd3fc;
			}

			.collage {
				position: relative;
				height: 610px;
			}

			.collage .screenshot-card {
				position: absolute;
				padding: 16px;
				border-radius: 24px;
			}

			.collage .screenshot-card img {
				border-radius: 14px;
			}

			.collage-main {
				left: 84px;
				top: 26px;
				width: 660px;
				height: 370px;
				z-index: 3;
			}

			.collage-side {
				right: 24px;
				top: 170px;
				width: 450px;
				height: 290px;
				z-index: 2;
				transform: rotate(3deg);
			}

			.collage-low {
				left: 220px;
				bottom: 12px;
				width: 520px;
				height: 300px;
				z-index: 4;
				transform: rotate(-2deg);
			}

			.cta {
				position: absolute;
				right: 76px;
				bottom: 62px;
				z-index: 4;
				padding: 14px 20px;
				border: 1px solid rgba(56, 189, 248, 0.46);
				border-radius: 999px;
				background: rgba(2, 6, 12, 0.78);
				font-size: 22px;
				font-weight: 850;
				color: #e0f2fe;
			}

			.post.digitall {
				background:
					radial-gradient(circle at 50% 62%, rgba(56, 189, 248, 0.2), transparent 0 250px, transparent 430px),
					radial-gradient(circle at 78% 18%, rgba(124, 58, 237, 0.18), transparent 0 260px, transparent 440px),
					linear-gradient(180deg, #010205 0%, #050711 50%, #010205 100%);
			}

			.post.digitall::before {
				background-image:
					linear-gradient(rgba(73, 98, 140, 0.18) 1px, transparent 1px),
					linear-gradient(90deg, rgba(73, 98, 140, 0.18) 1px, transparent 1px),
					radial-gradient(circle, rgba(167, 139, 250, 0.6) 0 1.8px, transparent 2.8px);
				background-size:
					128px 128px,
					128px 128px,
					120px 120px;
				opacity: 0.58;
			}

			.post.digitall::after {
				background:
					linear-gradient(112deg, transparent 0 54%, rgba(56, 189, 248, 0.2) 55%, transparent 58%),
					radial-gradient(circle at 50% 58%, transparent 0 260px, rgba(1, 2, 5, 0.18) 410px),
					linear-gradient(180deg, rgba(0, 0, 0, 0.04), rgba(0, 0, 0, 0.34));
			}

			.post.digitall .brand {
				top: 46px;
				left: 50%;
				transform: translateX(-50%);
				padding: 10px 20px 10px 12px;
				border: 1px solid rgba(125, 211, 252, 0.24);
				border-radius: 999px;
				background: rgba(3, 7, 18, 0.58);
				box-shadow: 0 0 26px rgba(56, 189, 248, 0.2);
			}

			.post.digitall .brand-mark {
				width: 48px;
				height: 48px;
				border-radius: 12px;
			}

			.post.digitall .brand-name {
				font-size: 26px;
				letter-spacing: 0;
			}

			.post.digitall .content {
				padding: 138px 70px 72px;
				text-align: center;
			}

			.post.digitall .kicker {
				margin: 0 0 22px;
				font-size: 18px;
				letter-spacing: 0;
			}

			.post.digitall .title {
				max-width: 940px;
				margin: 0 auto;
				font-family:
					Impact,
					Arial Black,
					Inter,
					Arial,
					sans-serif;
				font-size: 74px;
				font-weight: 950;
				line-height: 1.08;
				text-transform: uppercase;
				text-shadow:
					0 2px 0 rgba(255, 255, 255, 0.16),
					0 14px 42px rgba(0, 0, 0, 0.84),
					0 0 34px rgba(56, 189, 248, 0.18);
			}

			.post.digitall .subtitle {
				max-width: 830px;
				margin: 24px auto 0;
				font-size: 24px;
				line-height: 1.28;
			}

			.post.digitall .visual {
				left: 86px;
				right: 86px;
				bottom: 108px;
			}

			.post.digitall .screenshot-card {
				border-color: rgba(56, 189, 248, 0.82);
				border-radius: 24px;
				box-shadow:
					0 42px 90px rgba(0, 0, 0, 0.7),
					0 0 46px rgba(56, 189, 248, 0.28),
					0 0 1px 1px rgba(167, 139, 250, 0.2),
					inset 0 1px 0 rgba(255, 255, 255, 0.1);
			}

			.post.digitall .screenshot-card.large {
				height: 430px;
				padding: 18px;
				transform: perspective(1000px) rotateX(4deg) rotateY(-2deg);
			}

			.post.digitall .screenshot-card.tilt {
				height: 440px;
				transform: perspective(1050px) rotateX(6deg) rotateY(-8deg) rotateZ(-2deg);
			}

			.post.digitall .chips {
				gap: 28px;
				margin-top: 30px;
			}

			.post.digitall .chip {
				min-height: 70px;
				border-radius: 16px;
				background: rgba(6, 8, 16, 0.82);
				font-size: 25px;
				text-transform: uppercase;
				box-shadow:
					0 0 28px rgba(167, 139, 250, 0.18),
					inset 0 1px 0 rgba(255, 255, 255, 0.08);
			}

			.post.digitall .footer {
				left: 50%;
				bottom: 52px;
				transform: translateX(-50%);
				font-size: 22px;
			}

			.post.digitall.logo-focus .content {
				padding-top: 168px;
			}

			.post.digitall.logo-focus .title {
				font-size: 78px;
			}

			.post.digitall .logo-lockup {
				top: 604px;
			}

			.post.digitall .logo-lockup img {
				width: 172px;
				height: 172px;
			}

			.post.digitall .logo-word {
				font-family:
					Impact,
					Arial Black,
					Inter,
					sans-serif;
				font-size: 76px;
			}

			.post.digitall .connected-chip {
				height: 86px;
				background: rgba(5, 7, 14, 0.9);
				font-size: 30px;
				text-transform: uppercase;
			}

			.post.digitall .split-visual {
				height: 460px;
			}

			.post.digitall .matrix-panel,
			.post.digitall .process-panel,
			.post.digitall .metrics-panel {
				background: rgba(5, 8, 16, 0.86);
				border-color: rgba(125, 211, 252, 0.42);
			}

			.post.digitall .matrix-panel {
				min-height: 430px;
			}

			.post.digitall .process-panel,
			.post.digitall .metrics-panel {
				height: 460px;
			}

			.post.digitall .process-shot {
				height: 210px;
			}

			.post.digitall .metric-tile,
			.post.digitall .matrix-pill,
			.post.digitall .step {
				background: rgba(10, 15, 30, 0.9);
			}

			.post.digitall .collage {
				height: 540px;
			}

			.post.digitall .collage-main {
				left: 68px;
				top: 12px;
				width: 650px;
				height: 330px;
			}

			.post.digitall .collage-side {
				right: 16px;
				top: 144px;
				width: 410px;
				height: 260px;
			}

			.post.digitall .collage-low {
				left: 210px;
				bottom: 4px;
				width: 500px;
				height: 280px;
			}

			.post.digitall .cta {
				right: 76px;
				bottom: 58px;
			}
		</style>
	</head>
	<body>
		<div id="root"></div>
		<script>
			const asset = (path) => new URL(path, window.location.href).href;
			const logo = asset("./src/assets/bladeia-logo.png");

			const posts = [
				{
					id: 1,
					kicker: "Inbox comercial",
					title: 'Tu WhatsApp no está saturado. <span class="accent">Está desordenado.</span>',
					subtitle:
						"Si cada consulta cae en el mismo lugar, tu equipo responde tarde, pierde contexto y deja oportunidades sin seguimiento.",
					image: "./src/assets/feature-carousel/showcase-inbox-auto.png",
					layout: "screenshot",
					chips: ["Prioridad", "Contexto", "Seguimiento"],
				},
				{
					id: 2,
					title: 'Responde, retoma y recupera <span class="accent">oportunidades.</span>',
					subtitle: "",
					layout: "logo",
				},
				{
					id: 3,
					kicker: "IA + equipo",
					title: 'La IA responde. <span class="accent">Tu equipo decide.</span>',
					subtitle: "Automatizamos lo repetible y dejamos lo sensible en manos humanas.",
					image: "./src/assets/feature-carousel/showcase-inbox-payments.png",
					layout: "split",
				},
				{
					id: 4,
					kicker: "Carritos",
					title: 'Un carrito abandonado <span class="accent">todavía puede volver.</span>',
					subtitle: "Detecta oportunidades, prioriza las más valiosas y retoma la conversación con contexto.",
					image: "./src/assets/feature-carousel/showcase-carts.png",
					layout: "tilt",
					chips: ["Detectar", "Priorizar", "Retomar"],
				},
				{
					id: 5,
					kicker: "Campañas",
					title: 'Campañas con seguimiento, <span class="accent">no mensajes al aire.</span>',
					subtitle: "Segmenta, envía y mide qué conversaciones vuelven a moverse.",
					image: "./src/assets/feature-carousel/showcase-campaigns.png",
					layout: "screenshot",
					chips: ["Audiencia", "Mensaje", "Resultado"],
				},
				{
					id: 6,
					kicker: "Criterio operativo",
					title: '<span class="accent">Qué automatizar</span> y qué no.',
					subtitle: "La IA acelera lo repetible. El equipo humano sostiene lo crítico.",
					layout: "matrix",
				},
				{
					id: 7,
					kicker: "Método BladeIA",
					title: 'Así ordenamos tu operación <span class="accent">en WhatsApp.</span>',
					subtitle: "Diagnosticar. Conectar. Entrenar. Medir. Ajustar.",
					image: "./src/assets/feature-carousel/showcase-operations.png",
					layout: "process",
				},
				{
					id: 8,
					kicker: "Métricas",
					title: 'Lo que no se mide, <span class="accent">se pierde.</span>',
					subtitle: "Conversaciones, campañas, carritos y actividad comercial en una vista.",
					layout: "metrics",
				},
				{
					id: 9,
					kicker: "BladeIA",
					title: 'IA comercial para marcas que venden <span class="accent">por WhatsApp.</span>',
					subtitle: "Inbox, clientes, campañas, carritos y seguimiento en un mismo sistema.",
					layout: "collage",
				},
			];

			const icons = {
				chat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/><path d="M8 9h8M8 13h5"/></svg>',
				play: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><circle cx="12" cy="12" r="10"/><path d="m10 8 6 4-6 4z"/></svg>',
				refresh: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg>',
			};

			function brand() {
				return `<div class="brand"><img class="brand-mark" src="${logo}" alt=""><div class="brand-name">BladeIA</div></div>`;
			}

			function baseHeader(post) {
				return `
					${post.kicker ? `<div class="kicker">${post.kicker}</div>` : ""}
					<h1 class="title">${post.title}</h1>
					${post.subtitle ? `<p class="subtitle">${post.subtitle}</p>` : ""}
				`;
			}

			function screenshot(post, extraClass = "large") {
				return `
					<div class="visual">
						<div class="screenshot-card ${extraClass}">
							<img src="${asset(post.image)}" alt="">
						</div>
						${chips(post.chips || [])}
					</div>
				`;
			}

			function chips(items) {
				if (!items.length) return "";
				const classes = ["cyan", "violet", "green"];
				return `<div class="chips">${items
					.map((item, index) => `<div class="chip ${classes[index] || ""}">${item}</div>`)
					.join("")}</div>`;
			}

			function logoVisual() {
				return `
					<div class="connector" style="left: 288px; top: 713px; width: 244px; transform: rotate(18deg);"></div>
					<div class="connector" style="left: 548px; top: 747px; width: 248px; transform: rotate(-18deg);"></div>
					<div class="connector" style="left: 522px; top: 870px; width: 270px; transform: rotate(87deg);"></div>
					<div class="logo-lockup">
						<img src="${logo}" alt="">
						<div class="logo-word">Blade<span style="color:#38bdf8;background:none;-webkit-background-clip:initial;background-clip:initial;">IA</span></div>
					</div>
					<div class="connected-chip left">${icons.chat}<span>Responder</span></div>
					<div class="connected-chip right">${icons.play}<span>Retomar</span></div>
					<div class="connected-chip bottom">${icons.refresh}<span>Recuperar</span></div>
				`;
			}

			function splitVisual(post) {
				return `
					<div class="visual">
						<div class="split-visual">
							<div class="split-panel">
								<h2>IA</h2>
								<div class="bubble">Consulta frecuente detectada.</div>
								<div class="bubble reply">Respuesta lista con contexto.</div>
								<div class="bubble">Seguimiento sugerido.</div>
							</div>
							<div class="split-panel">
								<h2>Equipo</h2>
								<div class="mini-shot"><img src="${asset(post.image)}" alt=""></div>
							</div>
						</div>
					</div>
				`;
			}

			function matrixVisual() {
				const auto = ["Consultas frecuentes", "Catalogo", "Seguimiento", "Carritos"];
				const human = ["Reclamos", "Pagos", "Casos sensibles", "Decisiones"];
				return `
					<div class="visual">
						<div class="matrix-panel">
							<div>
								<h2>Automatizar</h2>
								<div class="matrix-list">${auto.map((item) => `<div class="matrix-pill">${item}</div>`).join("")}</div>
							</div>
							<div>
								<h2>Escalar a humano</h2>
								<div class="matrix-list">${human.map((item) => `<div class="matrix-pill">${item}</div>`).join("")}</div>
							</div>
						</div>
					</div>
				`;
			}

			function processVisual(post) {
				const steps = ["Diagnosticar", "Conectar", "Entrenar", "Medir", "Ajustar"];
				return `
					<div class="visual">
						<div class="process-panel">
							<div class="steps">${steps
								.map(
									(step, index) => `
										<div class="step">
											<div class="step-number">${index + 1}</div>
											<div class="step-label">${step}</div>
										</div>
									`,
								)
								.join("")}</div>
							<div class="process-shot"><img src="${asset(post.image)}" alt=""></div>
						</div>
					</div>
				`;
			}

			function metricsVisual() {
				const metrics = [
					["Conversaciones", "Prioridad", "Actividad reciente"],
					["Campañas", "Trazabilidad", "Envíos con contexto"],
					["Carritos", "Oportunidades", "Seguimiento comercial"],
					["Equipo", "Control", "Intervencion humana"],
				];
				return `
					<div class="visual">
						<div class="metrics-panel">
							<div class="metric-grid">${metrics
								.map(
									([label, value, note]) => `
										<div class="metric-tile">
											<div class="metric-label">${label}</div>
											<div class="metric-value">${value}</div>
											<div class="metric-note">${note}</div>
										</div>
									`,
								)
								.join("")}</div>
						</div>
					</div>
				`;
			}

			function collageVisual() {
				const imgs = [
					"./src/assets/feature-carousel/showcase-inbox-auto.png",
					"./src/assets/feature-carousel/showcase-campaigns.png",
					"./src/assets/feature-carousel/showcase-carts.png",
				];
				return `
					<div class="visual">
						<div class="collage">
							<div class="screenshot-card collage-main"><img src="${asset(imgs[0])}" alt=""></div>
							<div class="screenshot-card collage-side"><img src="${asset(imgs[1])}" alt=""></div>
							<div class="screenshot-card collage-low"><img src="${asset(imgs[2])}" alt=""></div>
						</div>
					</div>
					<div class="cta">bladeia.com</div>
				`;
			}

			function render(post) {
				let visual = "";
				let modeClass = "";
				const styleClass = params.get("style") === "digitall" ? "digitall" : "";

				if (post.layout === "logo") {
					modeClass = "logo-focus";
					visual = logoVisual();
				} else if (post.layout === "split") {
					visual = splitVisual(post);
				} else if (post.layout === "tilt") {
					visual = screenshot(post, "tilt");
				} else if (post.layout === "matrix") {
					visual = matrixVisual();
				} else if (post.layout === "process") {
					visual = processVisual(post);
				} else if (post.layout === "metrics") {
					visual = metricsVisual();
				} else if (post.layout === "collage") {
					visual = collageVisual();
				} else {
					visual = screenshot(post);
				}

				document.getElementById("root").innerHTML = `
					<main class="post ${modeClass} ${styleClass}">
						${brand()}
						<div class="orbit" style="right:-60px;top:92px;"></div>
						<div class="orbit" style="left:-170px;bottom:-70px;width:620px;height:620px;"></div>
						<section class="content">${baseHeader(post)}</section>
						${visual}
						<div class="footer">@bladeia.ok</div>
					</main>
				`;
			}

			const params = new URLSearchParams(window.location.search);
			const id = Number(params.get("post") || 1);
			render(posts.find((post) => post.id === id) || posts[0]);
			window.__READY__ = true;
		</script>
	</body>
</html>
