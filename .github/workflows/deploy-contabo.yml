name: Deploy backend to Contabo

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Desplegar la imagen después de validarla
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: contabo-production
  cancel-in-progress: false

jobs:
  validate-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Validate backend
        working-directory: backend
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
        run: |
          npm ci
          npm run prisma:validate
          npm run check:syntax
          npm run test:unit

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ghcr.io/ex1t-s/botlummine-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure deployment SSH key
        if: github.event_name == 'push' || inputs.deploy
        shell: bash
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.CONTABO_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.CONTABO_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/contabo_deploy
          chmod 600 ~/.ssh/contabo_deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy exact commit
        if: github.event_name == 'push' || inputs.deploy
        env:
          VPS_HOST: ${{ secrets.CONTABO_HOST }}
          VPS_USER: ${{ secrets.CONTABO_DEPLOY_USER }}
          VPS_PORT: ${{ secrets.CONTABO_SSH_PORT }}
        run: >-
          ssh -i ~/.ssh/contabo_deploy
          -p "${VPS_PORT:-22}"
          -o BatchMode=yes
          "$VPS_USER@$VPS_HOST"
          "sudo /usr/local/sbin/bladeia-deploy '${{ github.sha }}'"
